@if (view(); as v) {
  <header class="page-header">
    <div class="container">
      <nav class="breadcrumbs" aria-label="פירורי לחם">
        <a routerLink="/">דף הבית</a>
        <span aria-hidden="true">›</span>
        @if (v.term) {
          <a routerLink="/tags">מפתח נושאים</a>
        } @else {
          <span>ארכיון</span>
        }
      </nav>
      <p class="page-header__kicker">{{ kindLabel() }}</p>
      <h1 class="page-header__title">{{ v.title }}</h1>
      <p class="page-header__lead">
        {{ v.description }} · {{ v.total }} פריטים
        @if (v.totalPages > 1) {
          · עמוד {{ v.page }} מתוך {{ v.totalPages }}
        }
      </p>
    </div>
  </header>

  <div class="container">
    <div class="grid grid--cards">
      @for (card of v.items; track card.id) {
        <app-entry-card [card]="card" [headingLevel]="2" />
      }
    </div>
    <app-pagination [basePath]="v.basePath" [page]="v.page" [totalPages]="v.totalPages" />
  </div>
} @else {
  <app-not-found-page />
}
