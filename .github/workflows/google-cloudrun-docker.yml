# Builds the Docker image, pushes it to Artifact Registry
# (us-central1-docker.pkg.dev/shin-512818/w-parliament) and deploys it to Cloud Run
# on every push to "main".
#
# One-time setup:
#
# 1. Enable the APIs: artifactregistry.googleapis.com, run.googleapis.com, iamcredentials.googleapis.com
#
# 2. Create a Workload Identity Provider for this GitHub repository:
#    https://github.com/google-github-actions/auth#preferred-direct-workload-identity-federation
#    and save its full resource name as the repository variable GCP_WORKLOAD_IDENTITY_PROVIDER
#    (Settings -> Secrets and variables -> Actions -> Variables), e.g.
#    projects/123456789/locations/global/workloadIdentityPools/github/providers/w-parliament
#
#    Grant the GitHub principal:
#    - Artifact Registry Writer (roles/artifactregistry.writer) on the w-parliament repository
#    - Cloud Run Developer (roles/run.developer)
#    - Service Account User (roles/iam.serviceAccountUser) on the Cloud Run runtime service account
#
# 3. Make the service public once (Cloud Run Developer cannot change IAM policies):
#    gcloud run services add-iam-policy-binding w-parliament --region=us-central1 \
#      --member=allUsers --role=roles/run.invoker --project=shin-512818
#
# Optional repository variables: SITE_URL (default https://womenparliament.org), CONTACT_FORM_ENDPOINT.

name: 'Build and Deploy to Cloud Run'

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: 'cloud-run-deploy'
  cancel-in-progress: false

env:
  PROJECT_ID: 'shin-512818'
  REGION: 'us-central1'
  REPOSITORY: 'w-parliament'
  SERVICE: 'w-parliament'
  WORKLOAD_IDENTITY_PROVIDER: '${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}'

jobs:
  deploy:
    runs-on: 'ubuntu-latest'

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332' # actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2' # google-github-actions/auth@v2
        with:
          project_id: '${{ env.PROJECT_ID }}'
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'

      # Equivalent of: gcloud auth configure-docker us-central1-docker.pkg.dev
      - name: 'Docker Auth'
        uses: 'docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567' # docker/login-action@v3
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.auth_token }}'
          registry: '${{ env.REGION }}-docker.pkg.dev'

      - name: 'Build and Push Container'
        env:
          SITE_URL: '${{ vars.SITE_URL || ''https://womenparliament.org'' }}'
          CONTACT_FORM_ENDPOINT: '${{ vars.CONTACT_FORM_ENDPOINT }}'
        run: |-
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}"
          docker build \
            --build-arg SITE_URL="${SITE_URL}" \
            --build-arg CONTACT_FORM_ENDPOINT="${CONTACT_FORM_ENDPOINT}" \
            --tag "${IMAGE}:${{ github.sha }}" \
            --tag "${IMAGE}:latest" \
            .
          docker push --all-tags "${IMAGE}"

      - id: 'deploy'
        name: 'Deploy to Cloud Run'
        uses: 'google-github-actions/deploy-cloudrun@33553064113a37d688aa6937bacbdc481580be17' # google-github-actions/deploy-cloudrun@v2
        with:
          service: '${{ env.SERVICE }}'
          region: '${{ env.REGION }}'
          image: '${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}'
          # Lowest-cost profile for a static nginx site: request-based billing (CPU throttled outside requests),
          # scale to zero, gen1 (allows < 512Mi), high concurrency so one instance absorbs bursts.
          flags: '--port=8080 --cpu=1 --memory=256Mi --concurrency=500 --min-instances=0 --max-instances=3 --timeout=30s --cpu-throttling --no-cpu-boost --execution-environment=gen1'

      - name: 'Show output'
        run: |-
          echo "Deployed: ${{ steps.deploy.outputs.url }}"
