# Builds the Docker image, pushes it to Artifact Registry
# (us-central1-docker.pkg.dev/shin-512818/w-parliament) and deploys it to Cloud Run
# on every push to "main".
#
# One-time setup:
#
# 1. Enable the APIs: artifactregistry.googleapis.com, run.googleapis.com, iamcredentials.googleapis.com
#
# 2. Create the Workload Identity pool "github" and provider "w-parliament" for this repository
#    (the workflow uses projects/1056654439816/locations/global/workloadIdentityPools/github/providers/w-parliament;
#    override with the repository variable GCP_WORKLOAD_IDENTITY_PROVIDER if you use another one):
#
#    gcloud services enable sts.googleapis.com iamcredentials.googleapis.com --project=shin-512818
#    gcloud iam workload-identity-pools create github --project=shin-512818 --location=global
#    gcloud iam workload-identity-pools providers create-oidc w-parliament --project=shin-512818 \
#      --location=global --workload-identity-pool=github \
#      --issuer-uri="https://token.actions.githubusercontent.com" \
#      --attribute-mapping="google.subject=assertion.sub,attribute.repository=assertion.repository" \
#      --attribute-condition="assertion.repository=='Natalia-Gordon/w-parliament'"
#
#    The workflow impersonates the w-parliament service account, so allow the repository to do that:
#    gcloud iam service-accounts add-iam-policy-binding w-parliament@shin-512818.iam.gserviceaccount.com \
#      --project=shin-512818 --role=roles/iam.workloadIdentityUser \
#      --member="principalSet://iam.googleapis.com/projects/1056654439816/locations/global/workloadIdentityPools/github/attribute.repository/Natalia-Gordon/w-parliament"
#
#    The service account itself needs: Cloud Run Admin, Artifact Registry Writer and
#    Service Account User on the Cloud Run runtime service account.
#
# Optional repository variables: SITE_URL (default https://womenparliament.org), CONTACT_FORM_ENDPOINT.

name: 'Build and Deploy to Cloud Run'

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: 'cloud-run-deploy'
  cancel-in-progress: false

env:
  PROJECT_ID: 'shin-512818'
  REGION: 'us-central1'
  REPOSITORY: 'w-parliament'
  SERVICE: 'w-parliament'
  WORKLOAD_IDENTITY_PROVIDER: '${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || ''projects/1056654439816/locations/global/workloadIdentityPools/github/providers/w-parliament'' }}'
  SERVICE_ACCOUNT: 'w-parliament@shin-512818.iam.gserviceaccount.com'

jobs:
  deploy:
    runs-on: 'ubuntu-latest'

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332' # actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@f112390a2df9932162083945e46d439060d66ec2' # google-github-actions/auth@v2
        with:
          project_id: '${{ env.PROJECT_ID }}'
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ env.SERVICE_ACCOUNT }}'
          token_format: 'access_token'

      # Equivalent of: gcloud auth configure-docker us-central1-docker.pkg.dev
      - name: 'Docker Auth'
        uses: 'docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567' # docker/login-action@v3
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'
          registry: '${{ env.REGION }}-docker.pkg.dev'

      # Version tag shown in Artifact Registry, e.g. 20261027-1205-29b72b1-run42
      # (UTC date-time, short commit, GitHub Actions run number).
      - id: 'meta'
        name: 'Image metadata'
        run: |-
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="$(date -u +%Y%m%d-%H%M)-${SHORT_SHA}-run${GITHUB_RUN_NUMBER}"
          {
            echo "image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}"
            echo "version=${VERSION}"
            echo "created=${CREATED}"
            echo "short_sha=${SHORT_SHA}"
            echo "repo_label=$(echo "${GITHUB_REPOSITORY}" | tr 'A-Z/' 'a-z_')"
          } >> "${GITHUB_OUTPUT}"
          echo "Image version: ${VERSION}"

      - name: 'Build and Push Container'
        env:
          SITE_URL: '${{ vars.SITE_URL || ''https://womenparliament.org'' }}'
          CONTACT_FORM_ENDPOINT: '${{ vars.CONTACT_FORM_ENDPOINT }}'
          IMAGE: '${{ steps.meta.outputs.image }}'
          VERSION: '${{ steps.meta.outputs.version }}'
        run: |-
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          docker build \
            --build-arg SITE_URL="${SITE_URL}" \
            --build-arg CONTACT_FORM_ENDPOINT="${CONTACT_FORM_ENDPOINT}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.created=${{ steps.meta.outputs.created }}" \
            --label "org.opencontainers.image.ref.name=${GITHUB_REF_NAME}" \
            --label "com.github.actions.run-url=${RUN_URL}" \
            --label "com.github.actions.workflow=${GITHUB_WORKFLOW}" \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            --tag "${IMAGE}:latest" \
            .
          docker push --all-tags "${IMAGE}"
          {
            echo "### Image pushed"
            echo "- Version: \`${VERSION}\`"
            echo "- Commit: [${GITHUB_SHA::7}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            echo "- Image: \`${IMAGE}:${VERSION}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - id: 'deploy'
        name: 'Deploy to Cloud Run'
        uses: 'google-github-actions/deploy-cloudrun@33553064113a37d688aa6937bacbdc481580be17' # google-github-actions/deploy-cloudrun@v2
        with:
          service: '${{ env.SERVICE }}'
          region: '${{ env.REGION }}'
          image: '${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}'
          # Revision name: w-parliament-<short sha>-r<run number>-<attempt>
          suffix: '${{ steps.meta.outputs.short_sha }}-r${{ github.run_number }}-${{ github.run_attempt }}'
          # managed-by and commit-sha labels are added by the action itself
          labels: |-
            github-repo=${{ steps.meta.outputs.repo_label }}
            github-run-id=${{ github.run_id }}
          # Lowest-cost profile for a static nginx site: request-based billing (CPU throttled outside requests),
          # scale to zero, gen1 (allows < 512Mi), high concurrency so one instance absorbs bursts.
          flags: '--allow-unauthenticated --port=8080 --cpu=1 --memory=256Mi --concurrency=500 --min-instances=0 --max-instances=3 --timeout=30s --cpu-throttling --no-cpu-boost --execution-environment=gen1'

      - name: 'Show output'
        run: |-
          echo "Deployed ${{ steps.meta.outputs.version }}: ${{ steps.deploy.outputs.url }}"
          echo "- Cloud Run: ${{ steps.deploy.outputs.url }}" >> "${GITHUB_STEP_SUMMARY}"
